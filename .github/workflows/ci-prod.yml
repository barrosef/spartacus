name: CI/CD — Produção

on:
  push:
    branches: [main]

env:
  REGION: us-east1
  IMAGE: ${{ vars.FIREBASE_PROJECT_ID }}/spartacus-backend/api

jobs:
  # ─── Testes e verificações ─────────────────────────────────────────────────
  test:
    name: Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: js/pnpm-lock.yaml

      - name: Install JS dependencies
        working-directory: js
        run: pnpm install --frozen-lockfile

      - name: Lint + Typecheck + Build (JS, exceto app mobile)
        working-directory: js
        run: pnpm turbo run lint typecheck build --filter=!app

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install Python dependencies
        working-directory: backend
        run: uv sync

      - name: Lint backend (ruff)
        working-directory: backend
        run: uv run ruff check app/

      - name: Run backend tests
        working-directory: backend
        run: uv run pytest

  # ─── Deploy do backend (Cloud Run) ─────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend → Cloud Run
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # necessário para Workload Identity Federation
    steps:
      - uses: actions/checkout@v4

      - name: Autenticar no GCP via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker para Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build imagem Docker
        run: |
          docker build \
            --platform linux/amd64 \
            --target prod \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.IMAGE }}:latest \
            ./backend

      - name: Push imagem para Artifact Registry
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.IMAGE }}:latest

      - name: Deploy no Cloud Run
        run: |
          gcloud run deploy spartacus-backend \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.IMAGE }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --quiet

  # ─── Deploy do backoffice (Firebase Hosting) ───────────────────────────────
  deploy-backoffice:
    name: Deploy Backoffice → Firebase Hosting
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: js/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: js
        run: pnpm install --frozen-lockfile

      - name: Build backoffice
        working-directory: js
        run: pnpm turbo run build --filter=backoffice

      - name: Autenticar no GCP via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Deploy Firebase Hosting
        working-directory: infra
        run: |
          npx firebase-tools deploy \
            --only hosting \
            --project=${{ vars.FIREBASE_PROJECT_ID }} \
            --non-interactive

  # ─── Build mobile (Expo EAS) ───────────────────────────────────────────────
  build-mobile:
    name: Build Mobile → Expo EAS
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: js/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: js
        run: pnpm install --frozen-lockfile

      - name: Setup Expo e EAS CLI
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android (EAS)
        working-directory: js/app
        run: eas build --platform android --profile production --non-interactive
